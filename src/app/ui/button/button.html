<button
  #boton
  [class]="'boton boton--' + variante() + ' boton--' + tamano()"
  [class.cargando]="cargando()"
  [type]="tipo()"
  [disabled]="deshabilitado()"
  [attr.aria-label]="etiqueta()"
  [attr.aria-disabled]="cargando() || null"
  [attr.aria-busy]="cargando() || null"
  (click)="alHacerClic($event)"
>
  @if (cargando()) {
    <span class="contenido" role="status">
      <svg class="trazo" viewBox="0 0 28 8" aria-hidden="true" focusable="false">
        <path d="M1 4h22" />
        <path class="trazo__punta" d="m21 1 4 3-4 3" />
      </svg>
      {{ textoCargando() }}
    </span>
  } @else {
    <span class="contenido"><ng-content /></span>
  }
</button>
