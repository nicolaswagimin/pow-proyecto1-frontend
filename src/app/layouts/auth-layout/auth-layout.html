<header class="cabecera">
  <a class="marca" routerLink="/">
    <svg class="marca__logo" viewBox="0 0 28 20" aria-hidden="true" focusable="false">
      <rect x="1" y="1" width="11" height="8" rx="1" />
      <rect x="16" y="11" width="11" height="8" rx="1" />
      <path d="M6.5 9v6H16" />
    </svg>
    {{ nombreApp }}
  </a>
  <ui-theme-toggle />
</header>

<main class="hoja">
  <div class="contenido" #contenido>
    <ng-content select="[auth-encabezado]" />
    <ng-content />
    <ng-content select="[auth-pie]" />
  </div>
</main>

<aside class="mesa" aria-label="Diagrama en vivo de este formulario">
  <ng-content select="[auth-lienzo]" />
</aside>
