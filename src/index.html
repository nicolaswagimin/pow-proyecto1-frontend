<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Proyecto 1</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e3f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04121f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Solo los pesos que se usan: B612 400/700 (interfaz) y B612 Mono 400/700 (código y nodos). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap"
    />
    <script>
      // Aplica el tema guardado antes de pintar, para que no destelle el tema equivocado.
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.dataset.theme = tema === 'oscuro' ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
